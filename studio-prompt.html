<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Prompt — NyXia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0A1628; --bg2: #0F1C3F; --bg3: #1A2554;
      --p: #7B5CFF; --p2: #5A6CFF; --p3: #4FA3FF;
      --t: #FFFFFF; --t2: #D6D9F0; --t3: #8891B8; --t4: #4a5278;
      --green: #00E676;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg1); color: var(--t2); font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; }

    .header {
      padding: 14px 20px; border-bottom: 1px solid rgba(123,92,255,0.12);
      background: rgba(10,22,40,0.7); backdrop-filter: blur(10px);
      display: flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap;
    }
    .header-title {
      font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
      background: linear-gradient(135deg, #a78bfa, var(--p3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-sub { font-size: 12px; color: var(--t3); }
    .model-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .model-pill {
      padding: 7px 14px; border-radius: 50px; border: 1px solid rgba(123,92,255,0.25);
      background: rgba(123,92,255,0.06); color: var(--t3); font-family: 'Outfit', sans-serif;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .model-pill:hover { border-color: var(--p); color: var(--t2); }
    .model-pill.active {
      border-color: var(--p); color: #fff;
      background: linear-gradient(135deg, var(--p), var(--p2));
      box-shadow: 0 0 16px rgba(123,92,255,0.35);
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(123,92,255,0.25); border-radius: 2px; }

    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 12px; padding: 40px 20px; color: var(--t3);
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600;
      background: linear-gradient(135deg, #a78bfa, var(--p3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .empty-state p { max-width: 380px; font-size: 13px; line-height: 1.7; }

    .msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn .25s ease; }
    @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-bubble {
      padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.bot .msg-bubble {
      background: rgba(26,37,84,0.75); color: var(--t2);
      border: 1px solid rgba(123,92,255,0.12); border-top-left-radius: 4px;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--p), var(--p2)); color: #fff;
      border-top-right-radius: 4px;
    }
    .msg-meta { font-size: 10px; color: var(--t4); margin-top: 4px; padding: 0 4px; }
    .msg.user .msg-meta { text-align: right; }

    .msg-actions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .msg-actions button {
      padding: 3px 10px; border-radius: 50px; border: 1px solid rgba(123,92,255,0.15);
      background: rgba(123,92,255,0.04); color: var(--t4); font-family: 'Outfit', sans-serif;
      font-size: 11px; cursor: pointer; transition: all .15s;
    }
    .msg-actions button:hover { border-color: var(--p); color: var(--t2); }

    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--p3);
      display: inline-block; animation: bounce .9s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-5px); } }

    .input-wrap {
      padding: 14px 18px; border-top: 1px solid rgba(123,92,255,0.1);
      background: rgba(10,22,40,0.85); backdrop-filter: blur(10px);
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    .chat-input {
      flex: 1; background: rgba(15,28,63,0.7); border: 1px solid rgba(123,92,255,0.2);
      border-radius: 14px; color: var(--t); font-family: 'Outfit', sans-serif; font-size: 14px;
      padding: 12px 16px; outline: none; resize: none; min-height: 46px; max-height: 140px; line-height: 1.5;
    }
    .chat-input:focus { border-color: rgba(123,92,255,0.5); }
    .chat-input::placeholder { color: var(--t4); }
    .btn-send {
      width: 44px; height: 44px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--p), var(--p2)); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      box-shadow: 0 0 18px rgba(123,92,255,0.35); transition: all .2s; flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 28px rgba(123,92,255,0.55); }
    .btn-send:disabled { opacity: .45; cursor: not-allowed; }
    .hint { text-align: center; font-size: 11px; color: var(--t4); padding: 4px 0 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="header-title">⚡ Studio Prompt</div>
      <div class="header-sub">Exécute tes prompts avec le modèle de ton choix</div>
    </div>
    <div class="model-pills" id="model-pills">
      <button class="model-pill active" data-model="chatgpt" onclick="selectModel('chatgpt')">ChatGPT</button>
      <button class="model-pill" data-model="claude" onclick="selectModel('claude')">Claude</button>
      <button class="model-pill" data-model="grok" onclick="selectModel('grok')">Grok</button>
      <button class="model-pill" data-model="z" onclick="selectModel('z')">Z</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <div class="icon">⚡</div>
      <h2>Studio Prompt</h2>
      <p>Colle un prompt généré par NyXia, Éric, Diane… ou écris directement ta demande. Choisis le modèle en haut, puis envoie.</p>
    </div>
  </div>

  <div class="input-wrap">
    <textarea class="chat-input" id="chat-input" placeholder="Écris ou colle ton prompt ici…" rows="1"></textarea>
    <button class="btn-send" id="btn-send" onclick="sendMessage()">➤</button>
  </div>
  <div class="hint">Entrée pour envoyer · Shift+Entrée pour un retour à la ligne</div>

  <script>
  var sessionToken = sessionStorage.getItem('nyxia_token') || ''
  try {
    if (!sessionToken && window.parent && window.parent !== window) {
      sessionToken = window.parent.sessionStorage.getItem('nyxia_token') || ''
    }
  } catch (e) {}
  // Fallback : token passé par le dashboard parent
  try {
    if (!sessionToken && window.parent && window.parent.sessionToken) {
      sessionToken = window.parent.sessionToken
    }
  } catch (e) {}
  var currentModel = 'chatgpt'
  var history = []
  var MODEL_LABELS = { chatgpt: 'ChatGPT', claude: 'Claude', grok: 'Grok', z: 'Z' }

  ;(function checkAuth() {
    if (!sessionToken) { window.location.href = '/login.html'; return }
    fetch('/api/check-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: sessionToken })
    })
    .then(function(r) { return r.json() })
    .then(function(data) {
      if (!data.valid) window.location.href = '/login.html'
    })
    .catch(function() { window.location.href = '/login.html' })
  })()

  function selectModel(key) {
    currentModel = key
    document.querySelectorAll('.model-pill').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-model') === key)
    })
  }

  var input = document.getElementById('chat-input')
  input.addEventListener('input', function() {
    this.style.height = 'auto'
    this.style.height = Math.min(this.scrollHeight, 140) + 'px'
  })
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      sendMessage()
    }
  })

  function hideEmpty() {
    var el = document.getElementById('empty-state')
    if (el) el.style.display = 'none'
  }

  function addUserMessage(text) {
    hideEmpty()
    var msgs = document.getElementById('messages')
    var div = document.createElement('div')
    div.className = 'msg user'
    div.innerHTML = '<div><div class="msg-bubble"></div><div class="msg-meta">' + MODEL_LABELS[currentModel] + '</div></div>'
    div.querySelector('.msg-bubble').textContent = text
    msgs.appendChild(div)
    msgs.scrollTop = msgs.scrollHeight
  }

  function addBotMessage(text, modelUsed) {
    hideEmpty()
    var msgs = document.getElementById('messages')
    var div = document.createElement('div')
    div.className = 'msg bot'
    var label = MODEL_LABELS[currentModel] || modelUsed || ''
    div.innerHTML =
      '<div>' +
        '<div class="msg-bubble"></div>' +
        '<div class="msg-meta">' + escHtml(label) + '</div>' +
        '<div class="msg-actions">' +
          '<button type="button" class="btn-copy">📋 Copier</button>' +
        '</div>' +
      '</div>'
    div.querySelector('.msg-bubble').textContent = text
    div.querySelector('.btn-copy').addEventListener('click', function() {
      var btn = this
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = '✓ Copié'
        setTimeout(function() { btn.textContent = '📋 Copier' }, 1800)
      })
    })
    msgs.appendChild(div)
    msgs.scrollTop = msgs.scrollHeight
  }

  function addTyping() {
    hideEmpty()
    var msgs = document.getElementById('messages')
    var div = document.createElement('div')
    div.className = 'msg bot'
    div.id = 'typing-indicator'
    div.innerHTML = '<div class="msg-bubble"><span class="typing"><i></i><i></i><i></i></span></div>'
    msgs.appendChild(div)
    msgs.scrollTop = msgs.scrollHeight
  }

  function removeTyping() {
    var t = document.getElementById('typing-indicator')
    if (t) t.remove()
  }

  function sendMessage() {
    var text = input.value.trim()
    if (!text) return
    input.value = ''
    input.style.height = 'auto'

    addUserMessage(text)
    history.push({ role: 'user', content: text })

    var btn = document.getElementById('btn-send')
    btn.disabled = true
    addTyping()

    fetch('/api/studio-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        history: history.slice(0, -1).slice(-16),
        model: currentModel,
        token: sessionToken
      })
    })
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data } }) })
    .then(function(res) {
      removeTyping()
      var data = res.data || {}
      var reply = data.content || data.error || ('Aucune réponse (HTTP ' + res.status + ').')
      addBotMessage(reply, data.model)
      if (data.content && !data.error) {
        history.push({ role: 'assistant', content: reply })
        if (history.length > 24) history = history.slice(-24)
      } else {
        // Ne pas polluer l'historique avec une erreur technique
        history.pop()
      }
      btn.disabled = false
    })
    .catch(function(err) {
      removeTyping()
      addBotMessage('Erreur réseau : ' + (err && err.message ? err.message : 'réessaie dans un instant.'))
      history.pop()
      btn.disabled = false
    })
  }

  function escHtml(str) {
    var d = document.createElement('div')
    d.textContent = str || ''
    return d.innerHTML
  }
  </script>
</body>
</html>
