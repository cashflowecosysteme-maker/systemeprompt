<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion — Contenus prêts à publier</title><style>
:root{--bg:#060a18;--p:#7B5CFF;--lav:#a78bfa;--t:#fff;--t2:#d6d9f0;--t3:#8891b8;--red:#ff718d;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t2);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px 18px}h1{color:#fff}.card{background:#0e1430;border:1px solid rgba(167,139,250,.18);border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(167,139,250,.22);background:#091027;color:#fff}textarea{min-height:130px;resize:vertical}.btn{padding:10px 14px;border-radius:50px;border:1px solid rgba(167,139,250,.3);background:rgba(123,92,255,.15);color:#fff;cursor:pointer}.primary{background:var(--p)}.danger{border-color:rgba(255,113,141,.35);color:#ff9daf}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{padding:12px;border-top:1px solid rgba(167,139,250,.12);display:flex;justify-content:space-between;gap:14px}.meta{font-size:11px;color:var(--t3);margin-top:4px}.hidden{display:none}.msg{font-size:12px;margin:8px 0;color:var(--green)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}}</style></head><body><div class="wrap"><h1>📣 Gestion des contenus prêts à publier</h1><p>Ajoute tes modèles Canva sans toucher au code.</p><div id="login" class="card"><label>Mot de passe Super Admin</label><input type="password" id="pwd"><div class="row"><button class="btn primary" onclick="login()">Ouvrir la gestion</button></div><div class="msg" id="loginmsg"></div></div><div id="app" class="hidden"><div class="card"><div class="grid"><input type="hidden" id="id"><div><label>Titre</label><input id="titre"></div><div><label>Portail</label><select id="portail"><option>Studio Prompt</option><option>Alex</option><option>Léna</option><option>Séléna</option><option>Éric / CashFlow</option><option>Kael</option><option>Praticiens</option><option>NyXia</option><option>Autre</option></select></div><div><label>Plateforme</label><select id="plateforme"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>Multi-plateforme</option></select></div><div><label>Format</label><select id="format"><option>Publication</option><option>Story</option><option>Reel</option><option>Carrousel</option><option>Vidéo courte</option><option>Autre</option></select></div><div><label>Intention</label><select id="intention"><option>Créer une conversation</option><option>Faire découvrir</option><option>Éduquer</option><option>Témoignage</option><option>Coulisses</option><option>Invitation</option><option>Autre</option></select></div><div><label>Ordre</label><input type="number" id="ordre" value="0"></div><div class="full"><label>Lien Canva modifiable</label><input id="canvaUrl" placeholder="https://www.canva.com/design/..."></div><div class="full"><label>Lien aperçu image (optionnel)</label><input id="previewUrl" placeholder="https://..."></div><div class="full"><label>Texte prêt à publier</label><textarea id="texte"></textarea></div></div><div class="row"><button class="btn primary" onclick="save()">Enregistrer</button><button class="btn" onclick="resetForm()">Nouveau</button></div><div class="msg" id="msg"></div></div><div class="card"><b>Bibliothèque</b><div id="list"></div></div></div></div><script>
var ADMIN='';function v(id){return document.getElementById(id).value}async function login(){var r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v('pwd')})});var d=await r.json();if(!r.ok||!d.token){document.getElementById('loginmsg').textContent=d.error||'Accès refusé';return}ADMIN=d.token;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}
async function api(body){var r=await fetch('/api/admin/contenus',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN},body:JSON.stringify(body)});var d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');return d}
async function load(){var d=await api({action:'list'});window.ROWS=d.contenus||[];document.getElementById('list').innerHTML=ROWS.length?ROWS.map(function(r){return '<div class="item"><div><b>'+e(r.titre)+'</b><div class="meta">'+e(r.portail)+' · '+e(r.plateforme)+' · '+e(r.format)+'</div></div><div class="row"><button class="btn" onclick="edit(\''+r.id+'\')">Modifier</button><button class="btn danger" onclick="del(\''+r.id+'\')">Supprimer</button></div></div>'}).join(''):'<p class="meta">Aucun contenu pour le moment.</p>'}
function e(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}async function save(){var c={id:v('id')||undefined,titre:v('titre'),portail:v('portail'),plateforme:v('plateforme'),format:v('format'),intention:v('intention'),ordre:Number(v('ordre')||0),canvaUrl:v('canvaUrl'),previewUrl:v('previewUrl'),texte:v('texte')};await api({action:'save',contenu:c});document.getElementById('msg').textContent='Enregistré ✓';resetForm();load()}function edit(id){var r=ROWS.find(function(x){return x.id===id});if(!r)return;['id','titre','portail','plateforme','format','intention','ordre','canvaUrl','previewUrl','texte'].forEach(function(k){document.getElementById(k).value=r[k]??''});scrollTo(0,0)}async function del(id){if(!confirm('Supprimer ce contenu ?'))return;await api({action:'delete',id:id});load()}function resetForm(){document.getElementById('id').value='';document.getElementById('titre').value='';document.getElementById('canvaUrl').value='';document.getElementById('previewUrl').value='';document.getElementById('texte').value='';document.getElementById('ordre').value='0'}
</script></body></html>
