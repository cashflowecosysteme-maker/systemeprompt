<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mes Formations Vivantes — NyXia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#060a18;--p:#7B5CFF;--lav:#a78bfa;--t2:#d6d9f0;--t3:#8891b8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(123,92,255,.16),transparent 42%),var(--bg);color:var(--t2);font-family:Outfit,sans-serif}#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}.page{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:30px 24px 54px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);margin-bottom:7px}.title{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,5vw,44px);line-height:1;margin:0;color:#fff}.subtitle{margin:10px 0 6px;color:var(--t3);font-size:15px}.summary{margin:18px 0 24px;font-size:12px;color:var(--t3)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{position:relative;overflow:hidden;padding:18px;border-radius:20px;border:1px solid rgba(167,139,250,.18);background:linear-gradient(145deg,rgba(123,92,255,.09),rgba(255,255,255,.025));box-shadow:0 15px 45px rgba(0,0,0,.18);backdrop-filter:blur(14px)}.card:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(123,92,255,.13);filter:blur(36px);right:-70px;top:-80px;pointer-events:none}.top{display:flex;gap:13px;align-items:center;position:relative;z-index:1}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid rgba(167,139,250,.38);box-shadow:0 0 22px rgba(123,92,255,.22)}.who{font-size:13px;color:var(--lav);font-weight:700}.ftitle{font-size:16px;font-weight:700;color:#fff;margin-top:2px;line-height:1.25}.desc{font-size:12.5px;color:var(--t3);line-height:1.55;margin:14px 0;min-height:38px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--t3);margin:8px 0}.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--p),var(--lav));box-shadow:0 0 12px rgba(123,92,255,.45)}.btn{width:100%;margin-top:14px;border:1px solid rgba(167,139,250,.3);background:rgba(123,92,255,.10);backdrop-filter:blur(12px);box-shadow:0 0 22px rgba(123,92,255,.12);color:#fff;border-radius:50px;padding:10px 14px;font:600 12.5px Outfit,sans-serif;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);background:rgba(123,92,255,.17);box-shadow:0 0 28px rgba(123,92,255,.22)}.done{color:#b9f6cf}.empty,.loading{grid-column:1/-1;padding:34px 20px;text-align:center;border:1px dashed rgba(167,139,250,.2);border-radius:18px;color:var(--t3);background:rgba(123,92,255,.04)}@media(max-width:640px){.page{padding:22px 15px 42px}.grid{grid-template-columns:1fr}.desc{min-height:0}}
</style></head><body><canvas id="starry-canvas"></canvas><div class="page"><div class="eyebrow">Studio Prompt · NyXia</div><h1 class="title">🎓 Mes Formations Vivantes</h1><p class="subtitle">Apprends en petites bouchées avec les personnages de NyXia.</p><div class="summary" id="summary">Chargement de ton parcours…</div><div class="grid" id="grid"><div class="loading">✨ Je rassemble tes mini-formations…</div></div></div><script src="/starry-bg.js" defer></script><script>
var AGENTS=[{key:'alex',name:'Alex',img:'/Alex.png',rank:1},{key:'eric',name:'Éric',img:'/Eric.png',rank:2},{key:'selena',name:'Séléna',img:'/Selena.png',rank:3},{key:'lena',name:'Léna',img:'/Lena.png',rank:4},{key:'diane',name:'Diane',img:'/Diane.png',rank:5},{key:'nyxia',name:'NyXia',img:'/NyXia.png',rank:6},{key:'kael',name:'Kael',img:'/Kael.png',rank:7}];
function token(){try{return sessionStorage.getItem('nyxia_token')||(parent&&parent.sessionStorage&&parent.sessionStorage.getItem('nyxia_token'))||''}catch(e){return ''}}
function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function minutes(f){var n=Number(f.dureeMinutes||0);if(n>0)return Math.round(n);var blocks=(f.modules||[]).reduce(function(a,m){return a+Number(m.blocsCount||0)},0);return Math.max(5,blocks*3)}
function progressInfo(f){var mods=f.modules||[],p=f.progress||null,total=mods.reduce(function(a,m){return a+Math.max(1,Number(m.blocsCount||0))},0);if(!p||!total)return{pct:0,started:false,done:false,atEnd:false};var doneIds=Array.isArray(p.completed)?p.completed:[],units=0;mods.forEach(function(m){if(doneIds.indexOf(m.id)!==-1)units+=Math.max(1,Number(m.blocsCount||0))});var cur=mods.find(function(m){return(p.moduleId&&m.id===p.moduleId)||(p.moduleNumero!=null&&m.numero===p.moduleNumero)});if(cur&&doneIds.indexOf(cur.id)===-1)units+=Math.min(Math.max(0,Number(p.blocIndex||0)+1),Math.max(1,Number(cur.blocsCount||0)));var pct=Math.min(100,Math.round(units/total*100)),done=mods.length>0&&doneIds.length>=mods.length,atEnd=!done&&units>=total;if(done)pct=100;return{pct:pct,started:true,done:done,atEnd:atEnd}}
function openFormation(agent,f,pi){var mode=pi.done?'restart':(pi.atEnd?'advance':(pi.started?'resume':'start'));try{if(parent&&typeof parent.openFormationFromCard==='function'){parent.openFormationFromCard(agent.key,f.id,f.titre,mode);return}}catch(e){}alert('Ouvre '+agent.name+' dans Mes Conversations pour commencer cette mini-formation.')}
function card(agent,f){var pi=progressInfo(f),dur=minutes(f),status=pi.done?'Terminée ✓':(pi.started?pi.pct+' %':'0 %'),label=pi.done?'Revoir':(pi.atEnd?'Terminer':(pi.started?'Continuer':'Commencer')),el=document.createElement('article');el.className='card';el.innerHTML='<div class="top"><img class="avatar" src="'+agent.img+'" alt="'+esc(agent.name)+'"><div><div class="who">'+esc(agent.name)+'</div><div class="ftitle">'+esc(f.titre||'Mini-formation')+'</div></div></div><div class="desc">'+esc(f.description||'Une petite expérience guidée, simple et concrète.')+'</div><div class="meta"><span>⏱ ≈ '+dur+' min</span><span class="'+(pi.done?'done':'')+'">'+status+'</span></div><div class="bar"><div class="fill" style="width:'+pi.pct+'%"></div></div><button class="btn" type="button">'+label+' avec '+esc(agent.name)+'</button>';el.querySelector('button').addEventListener('click',function(){openFormation(agent,f,pi)});return{el:el,pi:pi}}
async function load(){var grid=document.getElementById('grid'),sum=document.getElementById('summary'),t=token();grid.innerHTML='';if(!t){grid.innerHTML='<div class="empty">Session introuvable. Reconnecte-toi au Studio Prompt.</div>';sum.textContent='';return}var rows=[];await Promise.all(AGENTS.map(async function(agent){try{var r=await fetch('/api/formation/list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,agent:agent.key})}),d=await r.json();(d.formations||[]).forEach(function(f){rows.push({agent:agent,f:f})})}catch(e){}}));rows.sort(function(a,b){return Number(a.f.ordre||0)-Number(b.f.ordre||0)||Number(a.agent.rank||99)-Number(b.agent.rank||99)});var started=0,done=0;rows.forEach(function(row){var c=card(row.agent,row.f);grid.appendChild(c.el);if(c.pi.started)started++;if(c.pi.done)done++});if(!rows.length)grid.innerHTML='<div class="empty">🎓 Les premières petites bouchées sont en préparation. Elles apparaîtront ici automatiquement dès qu’elles seront publiées.</div>';sum.textContent=rows.length?(started+' formation'+(started>1?'s':'')+' commencée'+(started>1?'s':'')+' · '+done+' terminée'+(done>1?'s':'')):'Ton espace de mini-formations vivantes'}
window.addEventListener('message',function(e){if(e.origin===window.location.origin&&e.data&&e.data.type==='nyxia_formations_refresh')load()});document.addEventListener('DOMContentLoaded',load);
</script></body></html>
