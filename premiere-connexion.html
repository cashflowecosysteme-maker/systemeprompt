<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Première connexion — Studio Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#0F1C3F;--bg2:#1A2554;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--red:#FF4B6E}
    *{box-sizing:border-box;margin:0;padding:0} body{min-height:100vh;background:var(--bg1);color:var(--t2);font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
    canvas#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none} body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 30% 20%,rgba(123,92,255,.15),transparent 65%),radial-gradient(ellipse 50% 40% at 70% 80%,rgba(79,163,255,.08),transparent 60%);pointer-events:none}
    .wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:24px}.card{background:rgba(26,37,84,.58);border:1px solid rgba(123,92,255,.22);border-radius:24px;padding:38px 34px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,.4)}
    .avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(123,92,255,.5);display:block;margin:0 auto 14px;box-shadow:0 0 34px rgba(123,92,255,.35)} h1{text-align:center;color:#fff;font-size:24px;margin-bottom:7px}.sub{text-align:center;color:var(--t3);font-size:13px;line-height:1.5;margin-bottom:28px}
    label{display:block;color:var(--t2);font-size:12px;font-weight:600;margin:0 0 7px}.field{margin-bottom:16px} input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(123,92,255,.25);background:rgba(8,15,34,.55);color:#fff;font:14px 'Outfit',sans-serif;outline:none}input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(123,92,255,.12)}
    button{width:100%;padding:13px 18px;border:0;border-radius:50px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font:600 14px 'Outfit',sans-serif;cursor:pointer;margin-top:4px}button:disabled{opacity:.55;cursor:wait}.pw-msg{display:none;padding:11px 13px;border-radius:11px;margin-top:15px;font-size:12px;text-align:center}.pw-msg.ok{display:block;color:#9cffc0;background:rgba(0,230,118,.09);border:1px solid rgba(0,230,118,.25)}.pw-msg.err{display:block;color:#ff9db0;background:rgba(255,75,110,.09);border:1px solid rgba(255,75,110,.25)}
    .back{text-align:center;margin-top:20px;font-size:12px}.back a{color:var(--p3);text-decoration:none}.note{font-size:11px;color:var(--t3);margin:-6px 0 15px}.hidden{display:none!important}
</style>
</head>
<body>
  <canvas id="starry-canvas"></canvas>
  <div class="wrap"><div class="card">
    <img class="avatar" src="/NyXia.png" alt="NyXia">
    <h1>Accès au Portail</h1>
    <div class="sub">Bienvenue dans l’Univers NyXia ! Crée ton mot de passe personnel pour accéder à ton portail.</div>
    <form id="first-setup-form">
      <div class="field"><label for="setup-password">Mot de passe</label><input id="setup-password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="note">8 caractères minimum.</div>
      <div class="field"><label for="setup-confirm">Confirme ton mot de passe</label><input id="setup-confirm" type="password" autocomplete="new-password" minlength="8" required></div>
      <button id="setup-btn" type="submit">Créer mon mot de passe</button>
      <div id="setup-msg" class="pw-msg" role="status" aria-live="polite"></div>
    </form>
    <div class="back"><a href="/login.html">← Retour à la connexion</a></div>
  </div></div>
  <script src="/js/starry-bg.js" defer></script>
  <script>
  (function(){
    var params=new URLSearchParams(location.search);
    var token=params.get('token')||params.get('sc')||'';
    var form=document.getElementById('first-setup-form');
    var button=document.getElementById('setup-btn');
    var msg=document.getElementById('setup-msg');
    function show(text,ok){msg.textContent=text;msg.className='pw-msg '+(ok?'ok':'err');}
    if(!token){button.disabled=true;show('Ce lien personnel est absent ou invalide. Utilise le lien reçu dans ton courriel NyXia.',false);}
    form.addEventListener('submit',async function(event){
      event.preventDefault();
      if(!token)return;
      var password=document.getElementById('setup-password').value;
      var confirm=document.getElementById('setup-confirm').value;
      if(password!==confirm){show('Les mots de passe ne correspondent pas.',false);return;}
      button.disabled=true;
      try{
        var response=await fetch('/api/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:password,confirm:confirm})});
        var data=await response.json();
        if(!response.ok || data.ok!==true)throw Error(data.error||'Création impossible.');
        show('Ton mot de passe est créé ! Tu peux maintenant te connecter.',true);
        form.reset();
        sessionStorage.removeItem('nyxia_token');
        token='';
        setTimeout(function(){location.href='/login.html';},1500);
      }catch(e){show(e.message||'Création impossible.',false);button.disabled=false;}
    });
  })();
  </script>
</body>
</html>
